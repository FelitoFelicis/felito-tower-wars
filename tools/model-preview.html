<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #c9cdd2; overflow: hidden; font: 12px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels span { position: absolute; transform: translate(-50%, 0); background: #f3e7c9; color: #3a2a12; padding: 1px 6px; border-radius: 4px; border: 1px solid #b89a5a; white-space: nowrap; font-weight: 700; }
  #info { position: fixed; left: 6px; top: 6px; background: #0008; color: #fff; padding: 3px 6px; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="info"></div>
<script src="../vendor/babylon-felito.js"></script>
<script type="module">
/*
 * Model preview for building figures.
 *   ?models=t-archer,t-footman   (default: every registered model)
 *   &tier=1|2|3                  model tier
 *   &cols=6                      models per row
 *   &yaw=0                       turn the models (radians; 1.57 = seen from their right side)
 *   &pitch=0.95                  camera pitch above the horizon (0.95 ≈ the game camera)
 *   &plate=1                     draw the tower plate under towers (default 1)
 *   &walk=0                      walk amplitude (1 = walking pose cycle)
 *   &labels=1                    name labels
 *   &kind=tower|creep|prop       filter by kind
 * window.__ready becomes true after the first frames; window.__stats lists triangle counts.
 */
import { View3D, MODELS, PLATE_H, Geo, FIG_SCALE, FIG_TILT, CAM_PITCH } from "../src/r3d.js";
import { plateGeo } from "../src/models/kit.js";
import "../src/models/index.js";

const q = new URLSearchParams(location.search);
const tier = Number(q.get("tier") || 1),
  yaw = Number(q.get("yaw") || 0),
  pitch = Number(q.get("pitch") || CAM_PITCH),
  walk = Number(q.get("walk") || 0),
  showPlate = q.get("plate") !== "0",
  labels = q.get("labels") !== "0",
  kind = q.get("kind");
let keys = q.get("models") ? q.get("models").split(",").map((s) => s.trim()).filter(Boolean) : [...MODELS.keys()];
if (kind) keys = keys.filter((k) => MODELS.get(k)?.meta.kind === kind);
const missing = keys.filter((k) => !MODELS.has(k));
keys = keys.filter((k) => MODELS.has(k));
const cols = Number(q.get("cols") || Math.min(keys.length, Math.ceil(Math.sqrt(keys.length * 1.6)))) || 1,
  rows = Math.ceil(keys.length / cols),
  gap = 1.35;

const canvas = document.getElementById("c");
const view = new View3D(canvas, { dpr: Math.min(2, devicePixelRatio || 1), clear: 0xc9cdd2 });
window.__view = view;
view.fog = { color: [0.79, 0.8, 0.82], near: 200, far: 400 };
const plates = new Map();
function plateBatch(element, size) {
  const id = "plate-" + element + "-" + size;
  if (!plates.has(id)) {
    const b = view.geoBatch(id, plateGeo(element, size));
    plates.set(id, b);
  }
  return plates.get(id);
}
const items = keys.map((key, i) => {
  const def = MODELS.get(key),
    c = i % cols,
    r = Math.floor(i / cols),
    size = def.meta.size || 1;
  return { key, def, x: (c - (cols - 1) / 2) * gap * Math.max(1, size * 0.9), z: (r - (rows - 1) / 2) * gap * 1.15, size, batch: view.model(key, tier) };
});
// ground
const ground = new Geo();
ground.box(cols * gap + 2, 0.02, rows * gap * 1.15 + 2, { at: [0, -0.011, 0], color: 0xb7bcc2 });
const gb = view.geoBatch("ground", ground);

function fit() {
  const w = canvas.clientWidth,
    h = canvas.clientHeight;
  // distance so the grid fits
  const spanX = cols * gap * 0.92,
    spanZ = rows * gap * 1.15 * 0.85;
  const fovY = view.camera.fov,
    aspect = w / h,
    fovX = 2 * Math.atan(Math.tan(fovY / 2) * aspect);
  const dX = spanX / 2 / Math.tan(fovX / 2),
    dZ = (spanZ * Math.sin(pitch) + 1.0 * Math.cos(pitch)) / 2 / Math.tan(fovY / 2);
  view.look(0, 0.45, 0.05, pitch, Math.max(dX, dZ) + 0.25);
}
let t0 = performance.now(),
  frames = 0;
function frame() {
  const now = performance.now(),
    dt = Math.min(0.05, (now - t0) / 1000);
  t0 = now;
  view.engine.resize();
  fit();
  view.beginAll();
  view.figure(gb, { ao: 0 });
  for (const it of items) {
    const tower = it.def.meta.kind === "tower";
    if (tower && showPlate) view.figure(plateBatch(it.def.meta.element || "neutral", it.size), { x: it.x, z: it.z, ao: 0 });
    const sc = tower ? FIG_SCALE : 1;
    view.figure(it.batch, { x: it.x, y: tower && showPlate ? PLATE_H : it.def.meta.flying ? 0.3 : 0, z: it.z, yaw, tilt: it.def.meta.kind === "prop" ? 0 : Number(q.get("tilt") ?? FIG_TILT), scale: sc, phase: view.time * 7, walk: it.def.meta.kind === "creep" ? walk : 0 });
    if (it.def.meta.kind !== "tower") view.decalAt(false, it.x, 0.002, it.z, 0.7, 0.5, 0, 0x000000, 0.25, 0);
  }
  view.endAll();
  view.render(dt);
  if (labels) {
    const box = document.getElementById("labels");
    if (!box.childElementCount) for (const it of items) box.appendChild(Object.assign(document.createElement("span"), { textContent: it.key + (it.batch ? "" : " (error)") }));
    items.forEach((it, i) => {
      const p = view.project(it.x, 0, it.z + 0.5);
      Object.assign(box.children[i].style, { left: p.x + "px", top: p.y + "px" });
    });
  }
  if (++frames === 4) {
    window.__stats = items.map((it) => ({ key: it.key, triangles: it.batch?.triangles ?? null }));
    document.getElementById("info").textContent = `${items.length} models · tier ${tier}` + (missing.length ? ` · missing: ${missing.join(", ")}` : "");
    window.__ready = true;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
