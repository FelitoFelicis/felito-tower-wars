<script>
  // Start diagnostics: show script errors on the loading screen instead of hanging silently.
  (function () {
    var shown = [];
    var en = true;
    // English only for now (v0.09g)
    function report(msg) {
      shown.push(String(msg).slice(0, 300));
      var el = document.getElementById("boot-msg") || document.getElementById("game-loader");
      if (el) el.textContent = (en ? "Start error: " : "Startfehler: ") + shown.join(" | ");
      else {
        el = document.getElementById("error-strip") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "error-strip" }));
        el.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:9999;padding:6px 10px;border-radius:8px;background:#7a1620e6;color:#fff;font:12px/1.3 system-ui,sans-serif;pointer-events:none";
        el.textContent = (en ? "Error: " : "Fehler: ") + shown.slice(-2).join(" | ");
      }
    }
    window.addEventListener("error", function (e) {
      report((e.message || (en ? "Script could not be loaded" : "Skript konnte nicht geladen werden")) + (e.filename ? " (" + e.filename.split("/").pop().split("?")[0] + ":" + e.lineno + ")" : e.target && e.target.src ? " (" + e.target.src.split("/").pop().split("?")[0] + ")" : ""));
    }, true);
    window.addEventListener("unhandledrejection", function (e) { report(e.reason && e.reason.message || e.reason); });
  })();
</script>

<script>
  // v0.24j: loading bar with percentage: the game's scripts (counted as they arrive), then the game's own steps (app.js)
  (function () {
    var shown = 0, label = "Loading …", stop = false;
    window.felitoBoot = function (pct, text) {
      if (text) label = text;
      if (pct >= 45) stop = true;
      shown = Math.max(shown, Math.min(100, pct));
      var fill = document.getElementById("boot-fill"), msg = document.getElementById("boot-msg");
      if (fill) fill.style.width = shown + "%";
      if (msg && !/error/i.test(msg.textContent)) msg.textContent = label + " " + Math.round(shown) + " %";
    };
    var map = document.querySelector('script[type="importmap"]'), want = 13;
    try { want = Object.keys(JSON.parse(map.textContent).imports).length + 1; } catch (e) {}
    (function poll() {
      if (stop) return;
      var got = 0;
      try { performance.getEntriesByType("resource").forEach(function (r) { if (/\/src\/[\w-]+\.js|babylon/.test(r.name)) got++; }); } catch (e) {}
      window.felitoBoot(3 + 42 * Math.min(1, got / want), "Loading game files …");
      setTimeout(poll, 120);
    })();
  })();
</script>
